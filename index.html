<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Pet Blocs 99 — Casse des pièces, éclos des pets</title>
    <link rel="icon" type="image/svg+xml" href="favicon.ico.svg" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="damage-layer"></div>

      <header id="hud-top">
        <div class="currency-pills">
          <div class="pill coins"><span class="ico">🪙</span><span id="stat-coins">0</span></div>
          <div class="pill gems"><span class="ico">💎</span><span id="stat-gems">0</span></div>
          <div class="pill diamonds"><span class="ico">✨</span><span id="stat-diamonds">0</span></div>
        </div>
        <nav class="top-actions">
          <button class="tool-btn" id="btn-shop"><span class="ticon">🛒</span><span class="tlabel">Boutique</span></button>
          <button class="tool-btn" id="btn-pets"><span class="ticon">🐾</span><span class="tlabel">Pets</span></button>
          <button class="tool-btn" id="btn-upgrades"><span class="ticon">⚡</span><span class="tlabel">Améliorer</span></button>
          <button class="tool-btn" id="btn-rebirth"><span class="ticon">🔄</span><span class="tlabel">Renaissance</span></button>
          <button class="tool-btn small" id="btn-settings"><span class="ticon">⚙️</span></button>
        </nav>
      </header>

      <div id="zone-banner">
        <span class="zb-name">Zone 1 · Prairie</span>
        <span class="zb-sub">Casse tout ce qui brille</span>
      </div>

      <div id="target-hud" class="hidden">
        <div class="target-row">
          <span id="target-name">Coffre</span>
          <span id="target-value">+0 🪙</span>
        </div>
        <div class="target-bar"><div id="target-fill"></div></div>
        <div class="target-hp"><span id="target-hp-text">0 / 0</span> PV</div>
      </div>

      <div id="pet-dock"></div>

      <div id="hint-bar">
        <span id="hint-text">Clique sur les pièces pour les casser</span>
        <span class="hint-dps">DPS : <b id="hint-dps-value">0</b></span>
      </div>

      <div id="toasts"></div>

      <!-- ============ PANELS ============ -->
      <div id="panel-backdrop" class="hidden"></div>

      <section class="panel hidden" id="panel-shop" aria-label="Boutique">
        <div class="panel-card">
          <header class="panel-head">
            <h2>🥚 Boutique d'œufs</h2>
            <button class="close-btn" data-close>✕</button>
          </header>
          <div class="panel-body" id="shop-body"></div>
        </div>
      </section>

      <section class="panel hidden" id="panel-pets" aria-label="Inventaire de pets">
        <div class="panel-card">
          <header class="panel-head">
            <h2>🐾 Mes pets <small id="pets-counter">0 / 3</small></h2>
            <button class="close-btn" data-close>✕</button>
          </header>
          <div class="panel-toolbar">
            <button id="btn-equip-best" class="mini-btn">⭐ Équiper les meilleurs</button>
            <button id="btn-sell-dupes" class="mini-btn danger">🗑️ Vendre les doublons</button>
          </div>
          <div class="panel-body" id="pets-body"></div>
        </div>
      </section>

      <section class="panel hidden" id="panel-upgrades" aria-label="Améliorations">
        <div class="panel-card">
          <header class="panel-head">
            <h2>⚡ Améliorations</h2>
            <button class="close-btn" data-close>✕</button>
          </header>
          <div class="panel-body" id="upgrades-body"></div>
        </div>
      </section>

      <section class="panel hidden" id="panel-rebirth" aria-label="Renaissance">
        <div class="panel-card">
          <header class="panel-head">
            <h2>🔄 Renaissance</h2>
            <button class="close-btn" data-close>✕</button>
          </header>
          <div class="panel-body" id="rebirth-body"></div>
        </div>
      </section>

      <section class="panel hidden" id="panel-settings" aria-label="Réglages">
        <div class="panel-card">
          <header class="panel-head">
            <h2>⚙️ Réglages</h2>
            <button class="close-btn" data-close>✕</button>
          </header>
          <div class="panel-body" id="settings-body"></div>
        </div>
      </section>

      <!-- ============ HATCH OVERLAY ============ -->
      <div id="hatch-overlay" class="hidden">
        <div class="hatch-stage">
          <div class="hatch-egg" id="hatch-egg">
            <div class="egg-shell"></div>
            <div class="egg-shine"></div>
          </div>
          <div class="hatch-result hidden" id="hatch-result"></div>
          <div class="hatch-title" id="hatch-title">Éclosion…</div>
          <button class="primary-btn hidden" id="hatch-close">Super !</button>
        </div>
      </div>

      <div id="loading">
        <div class="loading-inner">
          <div class="loading-logo">🐾</div>
          <h1>PET BLOCS <span>99</span></h1>
          <div class="loading-bar"><div id="loading-fill"></div></div>
          <p>Construction du monde…</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/ps99/main.js"></script>
  </body>
</html>
